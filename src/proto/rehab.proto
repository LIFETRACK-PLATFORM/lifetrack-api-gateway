syntax = "proto3";

package lifetrack.rehab;

service RehabService {
  rpc CreateRecoveryPlan (CreateRecoveryPlanRequest) returns (RecoveryPlanResponse);
  rpc ListRecoveryPlansByUser (ListRecoveryPlansByUserRequest) returns (ListRecoveryPlansByUserResponse);
  rpc UpdateRecoveryPlanStatus (UpdateRecoveryPlanStatusRequest) returns (UpdateRecoveryPlanStatusResponse);
  rpc AddExercise (AddExerciseRequest) returns (ExerciseResponse);
  rpc DeleteExercise (DeleteExerciseRequest) returns (DeleteExerciseResponse);
  rpc LogExercise (LogExerciseRequest) returns (ExerciseLogResponse);
  rpc AddAppointment (AddAppointmentRequest) returns (AddAppointmentResponse);
  rpc AddMeasurement (AddMeasurementRequest) returns (MeasurementResponse);
  rpc AddProgressPhoto (AddProgressPhotoRequest) returns (ProgressPhotoResponse);
  rpc ListRecoveryProgress (ListRecoveryProgressRequest) returns (RecoveryProgressResponse);
  rpc MarkExerciseCompletion (MarkExerciseCompletionRequest) returns (MarkExerciseCompletionResponse);
  rpc GetTodayExercises (GetTodayExercisesRequest) returns (GetTodayExercisesResponse);
  rpc GetWeeklySummary (GetWeeklySummaryRequest) returns (GetWeeklySummaryResponse);
  rpc AddPainLog (AddPainLogRequest) returns (PainLogResponse);
  rpc ListPainLogs (ListPainLogsRequest) returns (ListPainLogsResponse);
}

message CreateRecoveryPlanRequest {
  string userId = 1;
  string bodyPart = 2;
  string injuryType = 3;
  string surgeryDate = 4;
}

message ListRecoveryPlansByUserRequest {}

message RecoveryPlanSummary {
  string recoveryPlanId = 1;
  string bodyPart = 2;
  string injuryType = 3;
  string surgeryDate = 4;
  string status = 5;
}

message ListRecoveryPlansByUserResponse {
  repeated RecoveryPlanSummary plans = 1;
}

message RecoveryPlanResponse {
  string recoveryPlanId = 1;
  string userId = 2;
  string bodyPart = 3;
  string injuryType = 4;
  string surgeryDate = 5;
  string status = 6;
}

message UpdateRecoveryPlanStatusRequest {
  string recoveryPlanId = 1;
  string status = 2;
}

message UpdateRecoveryPlanStatusResponse {
  string recoveryPlanId = 1;
  string status = 2;
}

message AddExerciseRequest {
  string recoveryPlanId = 1;
  string name = 2;
  int32 targetSets = 3;
  int32 targetReps = 4;
  string referenceMediaUrl = 5;
  int32 phase = 6;
  repeated int32 daysOfWeek = 7;
}

message ExerciseResponse {
  string exerciseId = 1;
  string recoveryPlanId = 2;
  string name = 3;
  int32 targetSets = 4;
  int32 targetReps = 5;
  int32 phase = 6;
  repeated int32 daysOfWeek = 7;
}

message DeleteExerciseRequest {
  string exerciseId = 1;
}

message DeleteExerciseResponse {
  string exerciseId = 1;
  string recoveryPlanId = 2;
  bool deleted = 3;
}

message LogExerciseRequest {
  string exerciseId = 1;
  int32 setsDone = 2;
  int32 repsDone = 3;
  string date = 4;
}

message ExerciseLogResponse {
  string exerciseLogId = 1;
  string exerciseId = 2;
  int32 setsDone = 3;
  int32 repsDone = 4;
  string date = 5;
}

message AddAppointmentRequest {
  string recoveryPlanId = 1;
  string date = 2;
  string provider = 3;
  string notes = 4;
  string type = 5;
  int32 repeatWeeks = 6;
}

message AppointmentResponse {
  string appointmentId = 1;
  string recoveryPlanId = 2;
  string date = 3;
  string provider = 4;
  string notes = 5;
  string type = 6;
}

message AddAppointmentResponse {
  repeated AppointmentResponse appointments = 1;
}

message AddMeasurementRequest {
  string recoveryPlanId = 1;
  string type = 2;
  double value = 3;
  string unit = 4;
  string date = 5;
}

message MeasurementResponse {
  string measurementId = 1;
  string recoveryPlanId = 2;
  string type = 3;
  double value = 4;
  string unit = 5;
  string date = 6;
}

message AddProgressPhotoRequest {
  string recoveryPlanId = 1;
  string photoUrl = 2;
  string date = 3;
}

message ProgressPhotoResponse {
  string progressPhotoId = 1;
  string recoveryPlanId = 2;
  string photoUrl = 3;
  string date = 4;
}

message ListRecoveryProgressRequest {
  string recoveryPlanId = 1;
}

message ExerciseLogEntry {
  string exerciseLogId = 1;
  int32 setsDone = 2;
  int32 repsDone = 3;
  string date = 4;
}

message ExerciseCompletionEntry {
  string exerciseCompletionId = 1;
  string date = 2;
}

message ExerciseProgress {
  string exerciseId = 1;
  string name = 2;
  int32 targetSets = 3;
  int32 targetReps = 4;
  int32 phase = 5;
  repeated ExerciseLogEntry logs = 6;
  repeated int32 daysOfWeek = 7;
  repeated ExerciseCompletionEntry completions = 8;
}

message PainLogResponse {
  string painLogId = 1;
  string recoveryPlanId = 2;
  string date = 3;
  int32 level = 4;
  string note = 5;
}

message RecoveryProgressResponse {
  string recoveryPlanId = 1;
  string bodyPart = 2;
  string injuryType = 3;
  string surgeryDate = 4;
  string status = 5;
  repeated ExerciseProgress exercises = 6;
  repeated AppointmentResponse appointments = 7;
  repeated MeasurementResponse measurements = 8;
  repeated ProgressPhotoResponse progressPhotos = 9;
  repeated PainLogResponse painLogs = 10;
}

message MarkExerciseCompletionRequest {
  string exerciseId = 1;
  string date = 2;
  bool completed = 3;
}

message MarkExerciseCompletionResponse {
  string exerciseId = 1;
  string date = 2;
  bool completed = 3;
}

message GetTodayExercisesRequest {
  string recoveryPlanId = 1;
}

message TodayExerciseEntry {
  string exerciseId = 1;
  string name = 2;
  int32 targetSets = 3;
  int32 targetReps = 4;
  int32 phase = 5;
  bool scheduledToday = 6;
  bool completedToday = 7;
  bool urgent = 8;
}

message GetTodayExercisesResponse {
  repeated TodayExerciseEntry exercises = 1;
}

message GetWeeklySummaryRequest {
  string recoveryPlanId = 1;
  string referenceDate = 2;
}

message WeeklySummaryDay {
  string date = 1;
  int32 due = 2;
  int32 completed = 3;
  bool compliant = 4;
  bool isFuture = 5;
}

message AppointmentsByType {
  int32 therapy = 1;
  int32 medical = 2;
}

message GetWeeklySummaryResponse {
  string recoveryPlanId = 1;
  string weekStart = 2;
  string weekEnd = 3;
  repeated WeeklySummaryDay days = 4;
  int32 weeklyCompliancePercent = 5;
  AppointmentsByType appointmentsByType = 6;
  int32 streakDays = 7;
}

message AddPainLogRequest {
  string recoveryPlanId = 1;
  string date = 2;
  int32 level = 3;
  string note = 4;
}

message ListPainLogsRequest {
  string recoveryPlanId = 1;
  string from = 2;
  string to = 3;
}

message ListPainLogsResponse {
  repeated PainLogResponse painLogs = 1;
}
