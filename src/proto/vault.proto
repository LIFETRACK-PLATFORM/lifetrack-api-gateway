syntax = "proto3";

package lifetrack.vault;

service VaultService {
  rpc GetOrCreateVaultSalt (GetOrCreateVaultSaltRequest) returns (VaultSaltResponse);
  rpc CreateVaultItem (CreateVaultItemRequest) returns (VaultItemResponse);
  rpc ListVaultItems (ListVaultItemsRequest) returns (ListVaultItemsResponse);
  rpc GetEncryptedVaultItem (GetEncryptedVaultItemRequest) returns (EncryptedVaultItemResponse);
  rpc UpdateVaultItem (UpdateVaultItemRequest) returns (VaultItemResponse);
  rpc DeleteVaultItem (DeleteVaultItemRequest) returns (DeleteVaultItemResponse);
}

message GetOrCreateVaultSaltRequest {}

message VaultSaltResponse {
  string salt = 1;
}

message CreateVaultItemRequest {
  string site = 1;
  string username = 2;
  string encryptedBlob = 3;
  string iv = 4;
  string salt = 5;
  string encryptionVersion = 6;
}

message VaultItemResponse {
  string vaultItemId = 1;
  string userId = 2;
  string site = 3;
  string username = 4;
  string iv = 5;
  string salt = 6;
  string encryptionVersion = 7;
}

message ListVaultItemsRequest {}

message VaultItemSummary {
  string vaultItemId = 1;
  string site = 2;
  string username = 3;
  string encryptionVersion = 4;
  string createdAt = 5;
  string updatedAt = 6;
}

message ListVaultItemsResponse {
  repeated VaultItemSummary items = 1;
}

message GetEncryptedVaultItemRequest {
  string vaultItemId = 1;
}

message EncryptedVaultItemResponse {
  string vaultItemId = 1;
  string site = 2;
  string username = 3;
  string encryptedBlob = 4;
  string iv = 5;
  string salt = 6;
  string encryptionVersion = 7;
}

message UpdateVaultItemRequest {
  string vaultItemId = 1;
  string site = 2;
  string username = 3;
  string encryptedBlob = 4;
  string iv = 5;
  string salt = 6;
  string encryptionVersion = 7;
}

message DeleteVaultItemRequest {
  string vaultItemId = 1;
}

message DeleteVaultItemResponse {
  bool deleted = 1;
}
